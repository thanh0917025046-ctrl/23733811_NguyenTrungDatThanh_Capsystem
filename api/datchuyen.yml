const express = require('express');
const mysql = require('mysql2');
const cors = require('cors');

const app = express();
app.use(express.json());
app.use(cors());

// Kết nối cơ sở dữ liệu MySQL tự động nhận từ Docker Compose
const db = mysql.createConnection({
    host: process.env.DB_HOST || 'localhost',
    user: process.env.DB_USER || 'cab_user',
    password: process.env.DB_PASSWORD || 'cab_password123',
    database: process.env.DB_NAME || 'cab_system_db'
});

db.connect(err => {
    if (err) {
        console.error('Lỗi kết nối MySQL:', err);
        return;
    }
    console.log('Đã kết nối thành công với MySQL Database!');
    
    // Tự động tạo bảng bookings nếu chưa có
    const createTableQuery = `
        CREATE TABLE IF NOT EXISTS bookings (
            id INT AUTO_INCREMENT PRIMARY KEY,
            customer_name VARCHAR(255) NOT NULL,
            pickup_location VARCHAR(255) NOT NULL,
            dropoff_location VARCHAR(255) NOT NULL,
            status VARCHAR(50) DEFAULT 'Pending',
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
        )
    `;
    db.query(createTableQuery, (err) => {
        if (err) console.error('Lỗi tạo bảng bookings:', err);
        else console.log('Đã sẵn sàng bảng dữ liệu bookings!');
    });
});

// API Kiểm tra server
app.get('/', (req, res) => {
    res.send('CAB System API đặt chuyến đang hoạt động!');
});

// API Đặt chuyến mới (POST)
app.post('/api/bookings', (req, res) => {
    const { customer_name, pickup_location, dropoff_location } = req.body;
    
    if (!customer_name || !pickup_location || !dropoff_location) {
        return res.status(400).json({ error: 'Vui lòng cung cấp đầy đủ thông tin đặt chuyến!' });
    }

    const query = 'INSERT INTO bookings (customer_name, pickup_location, dropoff_location, status) VALUES (?, ?, ?, ?)';
    
    db.query(query, [customer_name, pickup_location, dropoff_location, 'Confirmed'], (err, result) => {
        if (err) {
            return res.status(500).json({ error: err.message });
        }
        res.status(201).json({ 
            message: 'Đặt chuyến thành công!', 
            bookingId: result.insertId,
            data: { customer_name, pickup_location, dropoff_location }
        });
    });
});

// API Lấy danh sách các chuyến đã đặt (GET)
app.get('/api/bookings', (req, res) => {
    db.query('SELECT * FROM bookings ORDER BY id DESC', (err, results) => {
        if (err) {
            return res.status(500).json({ error: err.message });
        }
        res.json(results);
    });
});

const PORT = process.env.PORT || 3000;
app.listen(PORT, () => {
    console.log(`Server API đang chạy tại cổng ${PORT}`);
});
