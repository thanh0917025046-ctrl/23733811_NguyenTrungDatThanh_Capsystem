openapi: 3.0.3
info:
  title: CAB System API - Booking Services
  version: 1.0.0
  description: Đặc tả API cho phân hệ Đặt chuyến xe dựa trên các FR và AC từ tài liệu SRS.

servers:
  - url: https://api.cabsystem.com/v1

tags:
  - name: Booking
    description: API liên quan đến quy trình khách hàng đặt chuyến (FR01, FR02, FR03, FR04).
  - name: Dispatch
    description: API liên quan đến tìm và phân công tài xế (FR05, FR06, FR07, FR08).

paths:
  # ==========================================
  # FR01 & FR02: NHẬP ĐIỂM ĐÓN / ĐIỂM ĐẾN
  # ==========================================
  /locations/search:
    get:
      tags:
        - Booking
      summary: "[FR01, FR02] Tìm kiếm và gợi ý địa chỉ"
      description: |
        Cho phép khách hàng nhập từ khóa để tìm điểm đón (FR01) và điểm đến (FR02).
      parameters:
        - name: query
          in: query
          required: true
          description: Từ khóa tìm kiếm địa chỉ.
          schema:
            type: string
            example: "Đại học Công nghiệp"
      responses:
        '200':
          description: Danh sách địa chỉ gợi ý kèm tọa độ.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationResult'
        '400':
          description: Yêu cầu không hợp lệ.

  # ==========================================
  # FR03 & FR12: CHỌN LOẠI XE VÀ TÍNH CƯỚC
  # ==========================================
  /bookings/estimate:
    post:
      tags:
        - Booking
      summary: "[FR03, FR12] Ước tính cước phí và danh sách xe"
      description: |
        Hiển thị danh sách loại xe (FR03) và tính cước chuyến đi dự kiến (FR12) dựa trên điểm đón và điểm đến.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
      responses:
        '200':
          description: Danh sách xe khả dụng và giá tiền ước tính.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        '400':
          description: Tọa độ không hợp lệ.

  # ==========================================
  # FR04: XÁC NHẬN ĐẶT CHUYẾN
  # ==========================================
  /bookings:
    post:
      tags:
        - Booking
      summary: "[FR04] Xác nhận đặt chuyến"
      description: |
        Thỏa mãn AC02: Khách hàng nhập đầy đủ điểm đón, điểm đến, loại xe và xác nhận thì hệ thống tạo chuyến thành công.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Tạo chuyến thành công, trả về Trip ID để theo dõi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Thiếu thông tin bắt buộc (Ngoại lệ BR01).

  # ==========================================
  # FR05, FR06, FR07, FR08: TÌM VÀ PHÂN CÔNG TÀI XẾ
  # ==========================================
  /dispatch/find-driver:
    post:
      tags:
        - Dispatch
      summary: "[FR05, FR06, FR07, FR08] Tìm và phân công tài xế"
      description: |
        Xác định tài xế sẵn sàng (FR05), tìm tài xế phù hợp và gần nhất (FR06), gửi yêu cầu (FR07).
        Thỏa mãn AC03: Nếu tài xế từ chối hoặc không phản hồi (FR08), hệ thống tự động tìm tài xế khác.
        *Lưu ý: API này thường được gọi tự động bởi background worker sau khi tạo booking thành công.*
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tripId]
              properties:
                tripId:
                  type: string
                  example: "TRIP12345"
      responses:
        '200':
          description: Đã tìm thấy và gửi yêu cầu cho tài xế phù hợp.
        '404':
          description: Không tìm thấy tài xế nào sẵn sàng.
        '408':
          description: Tài xế từ chối/hết hạn, đang tìm tài xế tiếp theo (FR08).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LocationResult:
      type: object
      properties:
        address:
          type: string
          example: "12 Nguyễn Văn Bảo, Gò Vấp"
        lat:
          type: number
          format: float
        lng:
          type: number
          format: float

    EstimateRequest:
      type: object
      required: [pickupLat, pickupLng, dropoffLat, dropoffLng]
      properties:
        pickupLat:
          type: number
        pickupLng:
          type: number
        dropoffLat:
          type: number
        dropoffLng:
          type: number

    EstimateResponse:
      type: object
      properties:
        distance:
          type: number
          example: 5.5
        options:
          type: array
          items:
            type: object
            properties:
              vehicleTypeId:
                type: integer
                example: 1
              name:
                type: string
                example: "Xe 4 Chỗ"
              price:
                type: number
                example: 65000

    BookingRequest:
      type: object
      required: [pickupLat, pickupLng, dropoffLat, dropoffLng, vehicleTypeId]
      properties:
        pickupLat:
          type: number
        pickupLng:
          type: number
        pickupAddress:
          type: string
        dropoffLat:
          type: number
        dropoffLng:
          type: number
        dropoffAddress:
          type: string
        vehicleTypeId:
          type: integer

    BookingResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        tripId:
          type: string
          example: "TRIP12345"
        status:
          type: string
          example: "SEARCHING_DRIVER"
