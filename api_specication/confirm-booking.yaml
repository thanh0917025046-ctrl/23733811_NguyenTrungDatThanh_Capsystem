openapi: 3.0.3
info:
  title: CAB System - FR04
  version: 1.0.0
  description: API cho FR04 - Xác nhận đặt chuyến
servers:
  - url: https://api.cabsystem.com/v1
paths:
  /bookings:
    post:
      summary: FR04 - Xác nhận tạo chuyến đi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickupAddress, dropoffAddress, vehicleTypeId]
              properties:
                pickupAddress: { type: string }
                dropoffAddress: { type: string }
                vehicleTypeId: { type: integer }
      responses:
        '201':
          description: Đặt chuyến thành công
