openapi: 3.0.3
info:
  title: CAB System - FR17
  version: 1.0.0
  description: API cho FR17 - Đánh giá tài xế
servers:
  - url: https://api.cabsystem.com/v1
paths:
  /trips/{tripId}/rating:
    post:
      summary: FR17 - Khách hàng gửi đánh giá tài xế sau chuyến đi
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: integer }
                comment: { type: string }
      responses:
        '200':
          description: Đánh giá thành công
